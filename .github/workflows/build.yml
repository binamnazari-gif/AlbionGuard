name: Build & Release Albion Guard

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Project ZIP
        run: unzip -o AlbionGuard-EU-Android.zip -d src

      - name: Download Xray Core (libv2ray.aar)
        run: |
          mkdir -p src/app/libs
          curl -fL -o src/app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read Version Name
        id: ver
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' src/app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APK
        working-directory: src
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp src/app/build/outputs/apk/release/app-release.apk AlbionGuard-v${{ steps.ver.outputs.version }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlbionGuard-v${{ steps.ver.outputs.version }}
          path: AlbionGuard-v${{ steps.ver.outputs.version }}.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" "AlbionGuard-v${{ steps.ver.outputs.version }}.apk" \
            --title "Albion Guard $TAG" \
            --notes "موتور نیتیو Xray گیمینگ (VLESS/SS/Trojan)، تست موازی و سوئیچ خودکار ۵ سرور برتر آلمان فقط برای آلبیون."
