name: Build AlbionGuard EU APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Project ZIP
        run: unzip -o AlbionGuard-EU-Android.zip -d src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/albionguard-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias albionguard \
            -storepass albionguard123 \
            -keypass albionguard123 \
            -dname "CN=AlbionGuardEU, OU=Gaming, O=AlbionGuard, L=Tehran, S=Tehran, C=IR"

      - name: Build Release APK
        working-directory: src
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/albionguard-release.jks
          KEYSTORE_PASSWORD: albionguard123
          KEY_ALIAS: albionguard
          KEY_PASSWORD: albionguard123
        run: gradle assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlbionGuard-EU-APK
          path: src/app/build/outputs/apk/release/app-release.apk
